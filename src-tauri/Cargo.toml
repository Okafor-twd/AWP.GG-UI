[package]
name = "awp-gg"
version = "0.1.0"
description = "AWP.GG Scripting UI"
authors = ["Okafor-Sx"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
open = "5"
tauri = { version = "1.5", features = [
  "fs-all",
  "path-all",
  "shell-open",
  "window-all",
  "dialog-all"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
